name: Release macOS
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-14
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: python3 scripts/public_repo_scan.py .
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build locked inputs
        run: python3 scripts/prepare-release-inputs.py
      - name: Exercise encrypted fixtures against the built WCDB
        run: |
          mkdir -p lib
          cp .build/libWCDB.dylib lib/libWCDB.dylib
          export WECHAT_CLI_WCDB_LIB="$PWD/lib/libWCDB.dylib"
          go test ./...
          go test -race ./...
      - name: Build package
        id: identity
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(go run ./cmd/wechat-cli --version | python3 -c 'import json,sys;print(json.load(sys.stdin)["data"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A pushed tag vX.Y.Z matching appVersion builds the stable package;
          # everything else (manual runs, prerelease tags) is a candidate.
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" == "v$version" && "$version" != *-* ]]; then
            scripts/package.sh "$version"
          else
            scripts/package.sh "$version" --candidate
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-package
          path: dist/wechat-cli-v*-darwin-arm64.zip*
          if-no-files-found: error
  draft:
    needs: package
    # Optional automation. Without the App the maintainer publishes the
    # downloaded artifact with scripts/publish-release.py and their gh login.
    if: vars.WECHAT_CLI_RELEASE_APP_ID != ''
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-package
          path: assets
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ vars.WECHAT_CLI_RELEASE_APP_ID }}
          private-key: ${{ secrets.WECHAT_CLI_RELEASE_APP_PRIVATE_KEY }}
          owner: r266-tech
          repositories: wechat-cli-releases
          permission-contents: write
      - name: Upload and read back draft bytes
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: python3 scripts/publish-release.py --directory assets --version "$RELEASE_VERSION"
